<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas - Sorpresa</title>

  <style>
    *,
    *::after,
    *::before {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --dark-color: #000;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--dark-color);
      overflow: hidden;
      perspective: 1000px;
      font-family: 'Poppins', Arial, sans-serif;
    }

    body.container * {
      -webkit-animation-play-state: paused !important;
      animation-play-state: paused !important;
    }

    /* =========================
       PANTALLA DE PREGUNTA
    ========================= */

    .question-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 50%, rgba(75, 0, 130, 0.4) 0%, #000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .question-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .question-box {
      background: rgba(20, 20, 40, 0.95);
      border: 3px solid #ffd700;
      border-radius: 15px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
      max-width: 500px;
    }

    .question-box h1 {
      color: #ffd700;
      font-size: 36px;
      margin-bottom: 30px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
      line-height: 1.4;
    }

    .question-box p {
      color: #ffed4e;
      font-size: 20px;
      margin-bottom: 40px;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }

    .btn {
      padding: 15px 45px;
      font-size: 18px;
      border: 2px solid;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      font-weight: bold;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-yes {
      color: #00ff00;
      border-color: #00ff00;
    }

    .btn-yes:hover {
      background: #00ff00;
      color: #000;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
      transform: scale(1.05);
    }

    .btn-no {
      color: #ff0080;
      border-color: #ff0080;
      position: relative;
      transition: top 0.2s ease, left 0.2s ease, transform 0.3s ease;
    }

    .btn-no:hover {
      background: #ff0080;
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.8);
    }

    /* =========================
       GALAXIA Y PÉTALOS
    ========================= */

    .night {
      position: fixed;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      overflow: hidden;
      filter: blur(0.08vmin);
      display: none;

      background:
        radial-gradient(
          ellipse at 50% 50%,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 215, 120, 0.08) 5%,
          rgba(95, 70, 180, 0.08) 18%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at center,
          #05040b 0%,
          #010105 50%,
          #000 100%
        );
    }

    .flowers-container.show .night {
      display: block;
    }

    /* GRANDE BRAZO DE LA GALAXIA */

    .night::before {
      content: "";
      position: absolute;
      width: 170%;
      height: 43%;
      left: -35%;
      top: 30%;
      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.72) 0%,
          rgba(255, 231, 172, 0.45) 5%,
          rgba(192, 157, 245, 0.24) 15%,
          rgba(105, 79, 180, 0.13) 30%,
          transparent 68%
        );

      transform: rotate(-12deg);
      filter: blur(9px);
      opacity: 0.95;
    }

    /* POLVO GALÁCTICO */

    .night::after {
      content: "";
      position: absolute;
      width: 165%;
      height: 32%;
      left: -32%;
      top: 34%;

      border-radius: 50%;

      background:
        repeating-radial-gradient(
          ellipse at center,
          transparent 0px,
          transparent 10px,
          rgba(255, 255, 255, 0.045) 12px,
          rgba(255, 220, 150, 0.035) 15px,
          transparent 19px
        );

      transform: rotate(-12deg);
      filter: blur(2px);
      opacity: 0.9;
    }

    /* ESTRELLAS */

    .galaxy-stars {
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.95) 0 0.8px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(255,235,170,0.85) 0 0.8px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(170,190,255,0.7) 0 0.7px,
          transparent 1.4px
        );

      background-size:
        75px 82px,
        137px 119px,
        181px 157px;

      background-position:
        12px 20px,
        47px 63px,
        83px 11px;

      opacity: 0.82;

      animation: galaxyStars 25s linear infinite;
    }

    @keyframes galaxyStars {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-35px, 20px);
      }
    }

    /* NÚCLEO DE LA GALAXIA */

    .galaxy-core {
      position: absolute;
      width: 55vmin;
      height: 55vmin;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.95) 0%,
          rgba(255,240,190,0.75) 3%,
          rgba(255,200,100,0.28) 9%,
          rgba(180,130,255,0.12) 22%,
          transparent 52%
        );

      filter: blur(1px);

      animation: galaxyCore 7s ease-in-out infinite;
    }

    @keyframes galaxyCore {
      0%, 100% {
        opacity: 0.7;
        transform: translate(-50%, -50%) scale(0.96);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    /* ESTRELLAS FUGACES */

    .shooting-star {
      position: absolute;
      width: 100px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.9),
          transparent
        );

      opacity: 0;
      transform: rotate(-25deg);

      filter: blur(0.4px);

      animation: shootingStar 10s linear infinite;
    }

    .shooting-star--1 {
      top: 22%;
      left: -12%;
      animation-delay: 2s;
    }

    .shooting-star--2 {
      top: 42%;
      left: -15%;
      transform: rotate(-25deg) scale(0.65);
      animation-delay: 6s;
    }

    @keyframes shootingStar {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-25deg);
      }

      7% {
        opacity: 0.8;
      }

      22% {
        opacity: 0;
        transform: translate(125vw, 45vh) rotate(-25deg);
      }

      100% {
        opacity: 0;
      }
    }

    /* PÉTALOS CAYENDO */

    .petals-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .petal {
      position: absolute;
      top: -10%;
      background: #ffd700;
      border-radius: 15px 0 15px 0;
      opacity: 0.8;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* =========================
       FLORES 3D
    ========================= */

    .flowers-container {
      display: none;
    }

    .flowers-container.show {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .flowers {
      position: relative;
      transform: scale(0.9);
      z-index: 10;
    }

    .flower {
      position: absolute;
      bottom: 10vmin;
      transform-origin: bottom center;
      z-index: 10;
      --fl-speed: 0.8s;
    }

    .message {
      background: #fce700;
      bottom: 50px;
      font-family: "Poppins", sans-serif;
      font-size: 40px;
      font-style: normal;
      font-weight: 800;
      height: auto;
      line-height: 1.2;
      padding: 12px 24px;
      position: absolute;
      opacity: 0;
      animation: fadeIn 1s forwards;
      animation-delay: 2s;
      color: #000;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
      z-index: 50;
      text-align: center;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .flower--1 {
      -webkit-animation: moving-flower-1 4s linear infinite;
      animation: moving-flower-1 4s linear infinite;
    }

    .flower--1 .flower__line {
      height: 70vmin;
      -webkit-animation-delay: 0.3s;
      animation-delay: 0.3s;
    }

    .flower--1 .flower__line__leaf--1 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
      animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
    }

    .flower--1 .flower__line__leaf--2 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
      animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
    }

    .flower--1 .flower__line__leaf--3 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
      animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
    }

    .flower--1 .flower__line__leaf--4 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 1s backwards;
      animation: blooming-leaf-left var(--fl-speed) 1s backwards;
    }

    .flower--1 .flower__line__leaf--5 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
      animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
    }

    .flower--1 .flower__line__leaf--6 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 2s backwards;
      animation: blooming-leaf-left var(--fl-speed) 2s backwards;
    }

    .flower--2 {
      left: 50%;
      transform: rotate(20deg);
      -webkit-animation: moving-flower-2 4s linear infinite;
      animation: moving-flower-2 4s linear infinite;
    }

    .flower--2 .flower__line {
      height: 60vmin;
      -webkit-animation-delay: 0.6s;
      animation-delay: 0.6s;
    }

    .flower--2 .flower__line__leaf--1 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
      animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
    }

    .flower--2 .flower__line__leaf--2 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
      animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
    }

    .flower--2 .flower__line__leaf--3 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
      animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
    }

    .flower--2 .flower__line__leaf--4 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
      animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
    }

    .flower--3 {
      left: 50%;
      transform: rotate(-15deg);
      -webkit-animation: moving-flower-3 4s linear infinite;
      animation: moving-flower-3 4s linear infinite;
    }

    .flower--3 .flower__line {
      -webkit-animation-delay: 0.9s;
      animation-delay: 0.9s;
    }

    .flower--3 .flower__line__leaf--1 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
      animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
    }

    .flower--3 .flower__line__leaf--2 {
      -webkit-animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
      animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
    }

    .flower--3 .flower__line__leaf--3 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
      animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
    }

    .flower--3 .flower__line__leaf--4 {
      -webkit-animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
      animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
    }

    .flower__leafs {
      position: relative;
      -webkit-animation: blooming-flower 2s backwards;
      animation: blooming-flower 2s backwards;
    }

    .flower__leafs--1 {
      -webkit-animation-delay: 1.1s;
      animation-delay: 1.1s;
    }

    .flower__leafs--2 {
      -webkit-animation-delay: 1.4s;
      animation-delay: 1.4s;
    }

    .flower__leafs--3 {
      -webkit-animation-delay: 1.7s;
      animation-delay: 1.7s;
    }

    .flower__leafs::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      width: 8vmin;
      height: 8vmin;
      background-color: #1aaa15;
      filter: blur(10vmin);
    }

    .flower__leaf {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 8vmin;
      height: 11vmin;
      border-radius: 51% 49% 47% 53%/44% 45% 55% 69%;
      background-color: #1aaa15;
      background-image: linear-gradient(to top, #fce700, #fce700);
      transform-origin: bottom center;
      opacity: 0.9;
      box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
    }

    .flower__leaf--1 {
      transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
    }

    .flower__leaf--2 {
      transform: translate(-50%, -4%) rotateX(40deg);
    }

    .flower__leaf--3 {
      transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
    }

    .flower__leaf--4 {
      width: 8vmin;
      height: 8vmin;
      transform-origin: bottom left;
      border-radius: 4vmin 10vmin 4vmin 4vmin;
      transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
      background-image: linear-gradient(to top, #fce700, #fce700);
      z-index: 1;
      opacity: 0.8;
    }

    .flower__white-circle {
      position: absolute;
      left: -3.5vmin;
      top: -3vmin;
      width: 9vmin;
      height: 4vmin;
      border-radius: 50%;
      background-color: #ffffff;
    }

    .flower__line {
      height: 55vmin;
      width: 1.5vmin;
      background-image:
        linear-gradient(
          to left,
          rgba(0, 0, 0, 0.2),
          transparent,
          rgba(255, 255, 255, 0.2)
        ),
        linear-gradient(
          to top,
          transparent 10%,
          #064600,
          #064600
        );

      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);

      -webkit-animation: grow-flower-tree 4s backwards;
      animation: grow-flower-tree 4s backwards;
    }

    .flower__line__leaf {
      --w: 7vmin;
      --h: calc(var(--w) + 2vmin);

      position: absolute;
      top: 20%;
      left: 90%;
      width: var(--w);
      height: var(--h);

      border-top-right-radius: var(--h);
      border-bottom-left-radius: var(--h);

      background-image:
        linear-gradient(
          to top,
          rgba(20, 122, 20, 0.4),
          #1aaa15
        );
    }

    .flower__line__leaf--1 {
      transform: rotate(70deg) rotateY(30deg);
    }

    .flower__line__leaf--2 {
      top: 45%;
      transform: rotate(70deg) rotateY(30deg);
    }

    .flower__line__leaf--3,
    .flower__line__leaf--4,
    .flower__line__leaf--6 {
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: var(--h);
      border-bottom-right-radius: var(--h);
      left: -460%;
      top: 12%;
      transform: rotate(-70deg) rotateY(30deg);
    }

    .flower__line__leaf--4 {
      top: 40%;
    }

    .flower__line__leaf--5 {
      top: 0;
      transform-origin: left;
      transform: rotate(70deg) rotateY(30deg) scale(0.6);
    }

    .flower__line__leaf--6 {
      top: -2%;
      left: -450%;
      transform-origin: right;
      transform: rotate(-70deg) rotateY(30deg) scale(0.6);
    }

    .flower__light {
      position: absolute;
      bottom: 0vmin;
      width: 1vmin;
      height: 1vmin;
      background-color: rgb(255, 251, 0);
      border-radius: 50%;
      filter: blur(0.2vmin);

      -webkit-animation: light-ans 4s linear infinite backwards;
      animation: light-ans 4s linear infinite backwards;
    }

    .flower__light:nth-child(odd) {
      background-color: #fce700;
    }

    .flower__light--1 {
      left: -2vmin;
      -webkit-animation-delay: 1s;
      animation-delay: 1s;
    }

    .flower__light--2 {
      left: 3vmin;
      -webkit-animation-delay: 0.5s;
      animation-delay: 0.5s;
    }

    .flower__light--3 {
      left: -6vmin;
      -webkit-animation-delay: 0.3s;
      animation-delay: 0.3s;
    }

    .flower__light--4 {
      left: 6vmin;
      -webkit-animation-delay: 0.9s;
      animation-delay: 0.9s;
    }

    .flower__light--5 {
      left: -1vmin;
      -webkit-animation-delay: 1.5s;
      animation-delay: 1.5s;
    }

    .flower__light--6 {
      left: -4vmin;
      -webkit-animation-delay: 3s;
      animation-delay: 3s;
    }

    .flower__light--7 {
      left: 3vmin;
      -webkit-animation-delay: 2s;
      animation-delay: 2s;
    }

    .flower__light--8 {
      left: -6vmin;
      -webkit-animation-delay: 3.5s;
      animation-delay: 3.5s;
    }

    @keyframes light-ans {
      0% {
        opacity: 0;
        transform: translateY(0vmin);
      }

      25% {
        opacity: 1;
        transform: translateY(-5vmin) translateX(-2vmin);
      }

      50% {
        opacity: 1;
        transform: translateY(-15vmin) translateX(2vmin);
        filter: blur(0.2vmin);
      }

      75% {
        transform: translateY(-20vmin) translateX(-2vmin);
        filter: blur(0.2vmin);
      }

      100% {
        transform: translateY(-30vmin);
        opacity: 0;
        filter: blur(1vmin);
      }
    }

    @keyframes moving-flower-1 {
      0%, 100% {
        transform: rotate(2deg);
      }

      50% {
        transform: rotate(-2deg);
      }
    }

    @keyframes moving-flower-2 {
      0%, 100% {
        transform: rotate(18deg);
      }

      50% {
        transform: rotate(14deg);
      }
    }

    @keyframes moving-flower-3 {
      0%, 100% {
        transform: rotate(-18deg);
      }

      50% {
        transform: rotate(-20deg) rotateY(-10deg);
      }
    }

    @keyframes blooming-leaf-right {
      0% {
        transform-origin: left;
        transform: rotate(70deg) rotateY(30deg) scale(0);
      }
    }

    @keyframes blooming-leaf-left {
      0% {
        transform-origin: right;
        transform: rotate(-70deg) rotateY(30deg) scale(0);
      }
    }

    @keyframes grow-flower-tree {
      0% {
        height: 0;
        border-radius: 1vmin;
      }
    }

    @keyframes blooming-flower {
      0% {
        transform: scale(0);
      }
    }

    .grow-ans {
      -webkit-animation: grow-ans 2s var(--d) backwards;
      animation: grow-ans 2s var(--d) backwards;
    }

    @keyframes grow-ans {
      0% {
        transform: scale(0);
        opacity: 0;
      }
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .question-box {
        width: 88%;
        padding: 38px 24px;
      }

      .question-box h1 {
        font-size: 26px;
      }

      .question-box p {
        font-size: 16px;
      }

      .night::before {
        width: 210%;
        left: -55%;
        height: 38%;
        top: 34%;
      }

      .night::after {
        width: 205%;
        left: -52%;
        top: 37%;
      }

      .galaxy-core {
        width: 80vmin;
        height: 80vmin;
      }

      .message {
        font-size: 24px;
        bottom: 30px;
        width: 90%;
      }
    }
  </style>
</head>

<body class="container">

  <!-- =========================
       PANTALLA 1
  ========================= -->

  <div class="question-screen" id="questionScreen1">

    <div class="question-box">

      <h1>🌻 Feliz día de las Flores Amarillas 🌻</h1>

      <p>¿Aceptas las flores amarillas?</p>

      <div class="btn-group">

        <button
          class="btn btn-yes"
          onclick="answerYes()">
          SÍ
        </button>

        <button
          class="btn btn-no"
          id="btnNo"
          onmouseover="moveButtonNo()"
          ontouchstart="moveButtonNo()"
          onclick="answerNo()">
          NO
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       PANTALLA CHI O CHI
  ========================= -->

  <div
    class="question-screen hidden"
    id="questionScreen2">

    <div class="question-box">

      <h1>🌙 Chi o Chi</h1>

      <p>Una pequeña sorpresa te espera...</p>

      <div class="btn-group">

        <button
          class="btn btn-yes"
          onclick="goToFlowers()">
          CHI
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       ESCENA DE FLORES
  ========================= -->

  <div
    class="flowers-container"
    id="flowersContainer">

    <!-- GALAXIA -->

    <div class="night">

      <div class="galaxy-stars"></div>

      <div class="galaxy-core"></div>

      <div class="shooting-star shooting-star--1"></div>

      <div class="shooting-star shooting-star--2"></div>

    </div>

    <!-- PÉTALOS CAYENDO -->
    <div class="petals-container" id="petalsContainer"></div>


    <!-- FLORES -->

    <div class="flowers">


      <!-- FLOR 1 -->

      <div class="flower flower--1">

        <div class="flower__leafs flower__leafs--1">

<script>
    const audioUrl = "chica_de_humo.mp3";
    const bgAudio = new Audio(audioUrl);
    bgAudio.loop = true;
    bgAudio.volume = 0.8;

    let noCount = 0;

    function moveButtonNo() {
      const btnNo = document.getElementById("btnNo");
      const randomX = (Math.random() - 0.5) * 200;
      const randomY = (Math.random() - 0.5) * 150;
      
      btnNo.style.position = "relative";
      btnNo.style.left = `${randomX}px`;
      btnNo.style.top = `${randomY}px`;
    }

    // Función forzada de reproducción tras interacción del usuario
    function playAudio() {
      bgAudio.play().then(() => {
        console.log("Audio reproduciendo correctamente");
      }).catch(error => {
        console.log("El navegador requiere interacción previa:", error);
      });
    }

    function createPetals() {
      const petalsContainer = document.getElementById("petalsContainer");
      const petalCount = 25;

      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        
        const size = Math.random() * 12 + 8;
        petal.style.width = `${size}px`;
        petal.style.height = `${size * 1.5}px`;
        petal.style.left = `${Math.random() * 100}%`;
        petal.style.animationDuration = `${Math.random() * 3 + 4}s`;
        petal.style.animationDelay = `${Math.random() * 5}s`;
        
        petalsContainer.appendChild(petal);
      }
    }

    function answerYes() {
      playAudio();
      goToFlowers();
    }

    function answerNo() {
      // Activar audio también al tocar "No" por si acaso
      playAudio(); 
      noCount++;
      if (noCount >= 2) {
        document.getElementById("questionScreen1").classList.add("hidden");
        document.getElementById("questionScreen2").classList.remove("hidden");
      } else {
        moveButtonNo();
      }
    }

    function goToFlowers() {
      document.getElementById("questionScreen1").classList.add("hidden");
      document.getElementById("questionScreen2").classList.add("hidden");
      document.getElementById("flowersContainer").classList.add("show");

      createPetals();

      setTimeout(() => {
        document.body.classList.remove("container");
      }, 100);
    }

    // Escuchador global: Al primer toque en cualquier lugar de la pantalla, desbloquea/reproduce el audio
    document.addEventListener("click", () => {
      if (bgAudio.paused) {
        playAudio();
      }
    }, { once: true });
  </script>
